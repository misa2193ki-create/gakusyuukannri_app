<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>学習管理アプリ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --accent:#f2807a;          /* テーマカラー（マイページで変更可） */
    --accent-deep:#ec6b64;
    --accent-soft:#fbe4e1;
    --bg1:#fdf1ec; --bg2:#fbe6e6;
    --card:#ffffff;
    --text:#3d3a3a; --sub:#a99e9c; --line:#f0e6e4;
    --time:#f4a63b;            /* 時計のオレンジ */
    --eng:#f0668f; --math:#f5a623; --jpn:#a06fd6; --sci:#5aa9d6; --etc:#c2bcbc;
    --hi:#ec6b64; --mid:#f5a623; --low:#b7aeae;
    --berry:#f8ddd6;           /* 背景より少し薄いイチゴの色（ここを変えると濃さ調整可） */
  }
  html,body{height:100%;}
  body{
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--text);
    font-family:-apple-system,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}

  /* ===== 背景：右上→左下に流れるイチゴ ===== */
  .bg-berries{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .berry{
    position:absolute;top:-18vh;width:70px;height:84px;
    background:var(--berry);
    -webkit-mask:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'><path d='M50 114C28 114 14 86 14 62 14 44 30 34 50 34 70 34 86 44 86 62 86 86 72 114 50 114Z' fill='%23000'/><path d='M50 14C53 26 60 30 68 28 63 36 56 38 54 40L46 40C44 38 37 36 32 28 40 30 47 26 50 14Z' fill='%23000'/></svg>") center/contain no-repeat;
            mask:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'><path d='M50 114C28 114 14 86 14 62 14 44 30 34 50 34 70 34 86 44 86 62 86 86 72 114 50 114Z' fill='%23000'/><path d='M50 14C53 26 60 30 68 28 63 36 56 38 54 40L46 40C44 38 37 36 32 28 40 30 47 26 50 14Z' fill='%23000'/></svg>") center/contain no-repeat;
    animation:drift linear infinite;
  }
  @keyframes drift{
    from{transform:translate3d(0,0,0) rotate(var(--r,0deg));}
    to  {transform:translate3d(-120vw,128vh,0) rotate(calc(var(--r,0deg) + 150deg));}
  }
  @media (prefers-reduced-motion: reduce){ .berry{animation:none;} }
  .screens{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 96px;}
  .screen{display:none;}
  .screen.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ===== ヘッダー ===== */
  .header{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 4px 12px;}
  .h-left{display:flex;gap:12px;align-items:flex-start;}
  .burger{background:none;border:none;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;gap:4px;margin-top:6px;}
  .burger span{width:22px;height:2.5px;border-radius:2px;background:var(--accent);display:block;}
  .greet{font-size:24px;font-weight:800;display:flex;align-items:center;gap:6px;}
  .greet small{font-size:22px;}
  .greet-sub{font-size:12px;color:var(--sub);margin-top:2px;}
  .h-right{display:flex;align-items:flex-start;gap:7px;}
  .h-dt{text-align:right;display:flex;flex-direction:column;gap:2px;}
  .h-date{font-size:12px;color:var(--sub);}
  .h-time{font-size:24px;font-weight:800;color:var(--time);line-height:1;}
  .bell{position:relative;font-size:20px;line-height:1;margin-top:1px;}
  .bell::after{content:"";position:absolute;right:-1px;top:-1px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1.5px solid #fff;}

  /* ===== カード共通 ===== */
  .card{background:var(--card);border-radius:22px;box-shadow:0 6px 18px rgba(228,150,140,.12);margin-bottom:16px;overflow:hidden;}
  .card-pad{padding:18px;}
  .sec-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;}
  .sec-title .ic{font-size:18px;}

  /* ===== 今日の学習記録 ===== */
  .study-head{background:linear-gradient(100deg,var(--accent),#f6a09a);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
  .study-head .sec-title{color:#fff;}
  .detail-btn{background:rgba(255,255,255,.25);border:none;color:#fff;font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;cursor:pointer;}
  .study-body{display:flex;gap:10px;padding:20px 16px 8px;}
  .ring-wrap{flex:0 0 150px;display:flex;flex-direction:column;align-items:center;}
  .ring{position:relative;width:150px;height:150px;}
  .ring svg{transform:rotate(-90deg);}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-center .lbl{font-size:11px;color:var(--sub);}
  .ring-center .big{font-size:30px;font-weight:800;letter-spacing:1px;}
  .ring-center .goal{font-size:11px;color:var(--sub);}
  .pct-pill{margin-top:10px;background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:800;padding:7px 12px;border-radius:16px;display:inline-flex;gap:5px;align-items:center;}
  .subj-list{flex:1;display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line);padding-left:14px;}
  .subj-row{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);}
  .subj-row:last-child{border-bottom:none;}
  .subj-row .name{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;}
  .subj-row .t{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
  .cheer{text-align:center;font-size:14px;font-weight:700;padding:6px 16px 18px;color:#6a6260;}

  /* ===== タスク ===== */
  .task-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .filters{display:flex;gap:6px;}
  .filters button{border:1.5px solid var(--line);background:#fff;color:var(--sub);font-size:12px;font-weight:700;padding:6px 12px;border-radius:16px;cursor:pointer;}
  .filters button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .task{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 12px;margin-bottom:9px;}
  .check{width:26px;height:26px;border-radius:50%;border:2px solid #d9cfcd;flex:0 0 26px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;transition:.15s;}
  .task.done .check{background:var(--accent);border-color:var(--accent);}
  .task .tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:9px;flex:0 0 auto;}
  .task .txt{flex:1;font-size:14px;font-weight:700;}
  .task.done .txt{text-decoration:line-through;color:var(--sub);}
  .task .pri{font-size:11px;font-weight:800;display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .task .del{background:none;border:none;color:#d9cfcd;font-size:18px;cursor:pointer;padding:0 2px;}
  .add-task{width:100%;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent-deep);font-size:14px;font-weight:800;padding:13px;border-radius:16px;cursor:pointer;margin-top:4px;}

  /* ===== 学習習慣 ===== */
  .habit-grid{display:flex;gap:12px;}
  .habit{flex:1;background:linear-gradient(160deg,#fff,#fef6f4);border:1.5px solid var(--line);border-radius:18px;padding:14px;}
  .habit .lbl{font-size:12px;color:var(--sub);margin-bottom:6px;}
  .habit .num{font-size:30px;font-weight:800;}
  .habit .num small{font-size:14px;font-weight:700;color:var(--sub);}
  .fab{position:absolute;right:14px;top:14px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;border:none;box-shadow:0 4px 12px rgba(236,107,100,.35);cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;}
  .habit-card{position:relative;overflow:hidden;}

  /* ===== 記録タブ ===== */
  .subj-picker{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px;}
  .subj-chip{border:2px solid var(--line);background:#fff;padding:9px 16px;border-radius:16px;font-size:14px;font-weight:800;cursor:pointer;}
  .subj-chip.on{color:#fff;}
  .min-row{display:flex;gap:8px;margin-bottom:12px;}
  .min-row input{flex:1;font-size:20px;font-weight:800;text-align:center;border:2px solid var(--line);border-radius:14px;padding:12px;font-family:inherit;}
  .quick{display:flex;gap:8px;margin-bottom:16px;}
  .quick button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;color:var(--accent-deep);}
  .save-btn{width:100%;background:var(--accent);color:#fff;border:none;font-size:16px;font-weight:800;padding:15px;border-radius:16px;cursor:pointer;box-shadow:0 6px 16px rgba(236,107,100,.3);}
  .log-item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .log-item .t{font-weight:800;font-variant-numeric:tabular-nums;}

  /* ===== カレンダー ===== */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-head button{background:var(--accent-soft);border:none;color:var(--accent-deep);width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:800;cursor:pointer;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-grid .wd{text-align:center;font-size:11px;color:var(--sub);font-weight:700;padding:4px 0;}
  .cal-cell{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#fff;border:1.5px solid var(--line);cursor:pointer;}
  .cal-cell.empty{background:none;border:none;}
  .cal-cell.today{border-color:var(--accent);}
  .cal-cell .m{font-size:9px;color:var(--accent-deep);font-weight:800;margin-top:1px;}

  /* ===== ノート ===== */
  .note-area{width:100%;min-height:340px;border:2px solid var(--line);border-radius:18px;padding:16px;font-size:15px;font-family:inherit;line-height:1.9;resize:vertical;}

  /* ===== マイページ ===== */
  .row{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line);}
  .row .k{font-size:14px;font-weight:700;}
  .row input{width:90px;text-align:center;border:2px solid var(--line);border-radius:12px;padding:9px;font-size:15px;font-weight:800;font-family:inherit;}
  .theme-dots{display:flex;gap:10px;}
  .theme-dots button{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;}
  .danger-btn{width:100%;border:2px solid var(--hi);background:#fff;color:var(--hi);font-weight:800;padding:13px;border-radius:14px;cursor:pointer;margin-top:8px;}
  .together{text-align:center;padding:8px 0;}
  .together .big{font-size:34px;font-weight:800;color:var(--accent-deep);}
  .together .lbl{font-size:13px;color:var(--sub);}

  /* ===== 下タブ ===== */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(228,150,140,.1);}
  .tab{flex:1;border:none;background:none;padding:8px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .tab .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;filter:grayscale(.4);opacity:.75;transition:.15s;}
  .tab .lab{font-size:10px;color:var(--sub);font-weight:700;}
  .tab.active .av{filter:none;opacity:1;transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.15);}
  .tab.active .lab{color:var(--accent-deep);}

  /* ===== モーダル ===== */
  .overlay{position:fixed;inset:0;background:rgba(60,40,40,.4);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.on{display:flex;}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px 18px 30px;animation:up .25s ease;}
  @keyframes up{from{transform:translateY(100%);}to{transform:none;}}
  .sheet h3{font-size:18px;font-weight:800;margin-bottom:16px;text-align:center;}
  .field{margin-bottom:14px;}
  .field label{font-size:12px;color:var(--sub);font-weight:700;display:block;margin-bottom:6px;}
  .field input,.field select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:15px;font-family:inherit;font-weight:600;}
  .pri-pick{display:flex;gap:8px;}
  .pri-pick button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:800;font-size:13px;cursor:pointer;}
  .pri-pick button.on{color:#fff;border-color:transparent;}
  .sheet-actions{display:flex;gap:10px;margin-top:8px;}
  .sheet-actions button{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;}
  .btn-cancel{background:#f0eae9;color:var(--sub);}
  .btn-ok{background:var(--accent);color:#fff;}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(60,40,40,.9);color:#fff;padding:12px 22px;border-radius:20px;font-size:14px;font-weight:700;opacity:0;transition:.3s;z-index:60;pointer-events:none;}
  .toast.on{opacity:1;}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:24px 0;}
</style>
</head>
<body>

  <div class="berry" style="left:12vw;width:44px;height:53px;animation-duration:17s;animation-delay:0s;--r:-20deg;"></div>
  <div class="berry" style="left:32vw;width:60px;height:72px;animation-duration:20s;animation-delay:-4s;--r:15deg;"></div>
  <div class="berry" style="left:52vw;width:70px;height:84px;animation-duration:23s;animation-delay:-9s;--r:-10deg;"></div>
  <div class="berry" style="left:72vw;width:50px;height:60px;animation-duration:18s;animation-delay:-2s;--r:25deg;"></div>
  <div class="berry" style="left:92vw;width:80px;height:96px;animation-duration:25s;animation-delay:-12s;--r:-30deg;"></div>
  <div class="berry" style="left:5vw;width:46px;height:55px;animation-duration:16s;animation-delay:-6s;--r:10deg;"></div>

  <div class="berry" style="left:44vw;width:56px;height:67px;animation-duration:19s;animation-delay:-7s;--r:20deg;"></div>
  <div class="berry" style="left:64vw;width:74px;height:88px;animation-duration:24s;animation-delay:-18s;--r:-12deg;"></div>
  <div class="berry" style="left:84vw;width:48px;height:58px;animation-duration:17s;animation-delay:-3s;--r:30deg;"></div>
  <div class="berry" style="left:104vw;width:62px;height:74px;animation-duration:22s;animation-delay:-11s;--r:-8deg;"></div>
  <div class="berry" style="left:16vw;width:54px;height:65px;animation-duration:20s;animation-delay:-14s;--r:18deg;"></div>
  <div class="berry" style="left:36vw;width:42px;height:50px;animation-duration:15s;animation-delay:-8s;--r:-25deg;"></div>
  <div class="berry" style="left:56vw;width:68px;height:81px;animation-duration:23s;animation-delay:-20s;--r:12deg;"></div>
  <div class="berry" style="left:76vw;width:58px;height:70px;animation-duration:19s;animation-delay:-5s;--r:-15deg;"></div>
  <div class="berry" style="left:96vw;width:52px;height:62px;animation-duration:18s;animation-delay:-16s;--r:22deg;"></div>
  <div class="berry" style="left:0vw;width:66px;height:79px;animation-duration:24s;animation-delay:-10s;--r:-28deg;"></div>
  <div class="berry" style="left:48vw;width:46px;height:55px;animation-duration:16s;animation-delay:-19s;--r:8deg;"></div>

  <div class="berry" style="left:88vw;width:50px;height:60px;animation-duration:20s;animation-delay:-13s;--r:16deg;"></div>
  <div class="berry" style="left:28vw;width:60px;height:72px;animation-duration:21s;animation-delay:-22s;--r:-14deg;"></div>

</div>
<div class="app">

  <!-- ===== ヘッダー ===== -->
  <div class="header">
    <div class="h-left">
      <button class="burger" id="burger"><span></span><span></span><span></span></button>
      <div>
        <div class="greet"><span id="greetText">おはよう！</span><small id="greetIcon">☀️</small></div>
        <div class="greet-sub">今日も一緒にがんばろう！</div>
      </div>
    </div>
    <div class="h-right">
      <div class="h-dt">
        <div class="h-date" id="hDate">--月--日</div>
        <div class="h-time" id="hTime">--:--</div>
      </div>
      <div class="bell">🔔</div>
    </div>
  </div>

  <div class="screens">

    <!-- ============ ホーム ============ -->
    <section class="screen active" id="screen-home">

      <div class="card">
        <div class="study-head">
          <div class="sec-title"><span class="ic">📋</span>今日の学習記録</div>
          <button class="detail-btn" onclick="go('record')">詳細を見る ›</button>
        </div>
        <div class="study-body">
          <div class="ring-wrap">
            <div class="ring">
              <svg width="150" height="150" viewBox="0 0 150 150">
                <circle cx="75" cy="75" r="62" fill="none" stroke="var(--accent-soft)" stroke-width="13"/>
                <circle id="ringProg" cx="75" cy="75" r="62" fill="none" stroke="var(--accent)" stroke-width="13" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="389.6"/>
              </svg>
              <div class="ring-center">
                <div class="lbl">今日の学習時間</div>
                <div class="big" id="todayTime">00:00</div>
                <div class="goal" id="todayGoal">/ 05:00</div>
              </div>
            </div>
            <div class="pct-pill">📈 目標時間の<span id="todayPct">0</span>%</div>
          </div>
          <div class="subj-list" id="subjList"></div>
        </div>
        <div class="cheer" id="cheer">🍓 今日の勉強を記録してみよう！</div>
      </div>

      <div class="card card-pad">
        <div class="task-head">
          <div class="sec-title"><span class="ic">📝</span>今日のタスク</div>
          <div class="filters">
            <button data-f="all">すべて</button>
            <button data-f="open" class="on">未完了</button>
            <button data-f="done">完了</button>
          </div>
        </div>
        <div id="taskList"></div>
        <button class="add-task" onclick="openTask()">＋ タスクを追加</button>
      </div>

      <div class="card card-pad habit-card">
        <div class="sec-title" style="margin-bottom:14px;"><span class="ic">📊</span>学習習慣</div>
        <button class="fab" onclick="openTask()">＋</button>
        <div class="habit-grid">
          <div class="habit">
            <div class="lbl">連続学習日数</div>
            <div class="num"><span id="streakNum">0</span><small>日</small> 🔥</div>
          </div>
          <div class="habit">
            <div class="lbl">今週の学習時間</div>
            <div class="num" id="weekTime" style="font-size:24px;">00:00 <small id="weekGoal">/ 25:00</small></div>
            <svg id="weekChart" width="100%" height="52" viewBox="0 0 150 52" preserveAspectRatio="none" style="margin-top:4px;"></svg>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ カレンダー ============ -->
    <section class="screen" id="screen-calendar">
      <div class="card card-pad">
        <div class="cal-head">
          <button onclick="calMove(-1)">‹</button>
          <div class="sec-title" id="calTitle">2026年5月</div>
          <button onclick="calMove(1)">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="card card-pad" id="calDetail" style="display:none;">
        <div class="sec-title" id="calDetailTitle" style="margin-bottom:10px;"></div>
        <div id="calDetailList"></div>
      </div>
    </section>

    <!-- ============ 記録 ============ -->
    <section class="screen" id="screen-record">
      <div class="card card-pad">
        <div class="sec-title" style="margin-bottom:6px;"><span class="ic">✏️</span>勉強を記録する</div>
        <div class="subj-picker" id="recPicker"></div>
        <div class="min-row"><input type="number" id="recMin" placeholder="0" min="0" inputmode="numeric"> <div style="align-self:center;font-weight:800;color:var(--sub);">分</div></div>
        <div class="quick">
          <button onclick="addMin(15)">+15</button>
          <button onclick="addMin(30)">+30</button>
          <button onclick="addMin(60)">+60</button>
          <button onclick="setMin(0)">クリア</button>
        </div>
        <button class="save-btn" onclick="saveLog()">この内容で記録する</button>
      </div>
      <div class="card card-pad">
        <div class="sec-title" style="margin-bottom:8px;"><span class="ic">📖</span>今日の記録</div>
        <div id="recToday"></div>
      </div>
    </section>

    <!-- ============ ノート ============ -->
    <section class="screen" id="screen-note">
      <div class="card card-pad">
        <div class="sec-title" style="margin-bottom:10px;"><span class="ic">📓</span>メモ・ノート</div>
        <textarea class="note-area" id="noteArea" placeholder="今日の反省、覚えておきたいこと、目標などを自由に書けます。&#10;入力すると自動で保存されます。"></textarea>
      </div>
    </section>

    <!-- ============ マイページ ============ -->
    <section class="screen" id="screen-mypage">
      <div class="card card-pad">
        <div class="together">
          <div class="lbl">一緒に過ごした時間</div>
          <div class="big" id="totalTogether">00:00</div>
        </div>
      </div>
      <div class="card card-pad">
        <div class="sec-title" style="margin-bottom:6px;">⚙️ 目標設定</div>
        <div class="row"><span class="k">1日の目標（分）</span><input type="number" id="setDaily" min="1"></div>
        <div class="row"><span class="k">1週間の目標（分）</span><input type="number" id="setWeekly" min="1"></div>
        <div class="row"><span class="k">最高連続日数</span><span id="bestStreak" style="font-weight:800;">0 日</span></div>
        <button class="save-btn" style="margin-top:14px;" onclick="saveSettings()">目標を保存</button>
      </div>
      <div class="card card-pad">
        <div class="sec-title" style="margin-bottom:12px;">🎨 テーマカラー</div>
        <div class="theme-dots" id="themeDots"></div>
      </div>
      <div class="card card-pad">
        <div class="sec-title" style="margin-bottom:8px;">🗂️ データ</div>
        <button class="danger-btn" onclick="resetAll()">すべてのデータを消す</button>
      </div>
    </section>

  </div>

  <!-- ===== 下タブ ===== -->
  <nav class="tabbar">
    <button class="tab active" data-screen="home"><span class="av" style="background:#ec6b64;">🐱</span><span class="lab">ホーム</span></button>
    <button class="tab" data-screen="calendar"><span class="av" style="background:#f5a623;">📅</span><span class="lab">カレンダー</span></button>
    <button class="tab" data-screen="record"><span class="av" style="background:#f6c445;">✏️</span><span class="lab">記録</span></button>
    <button class="tab" data-screen="note"><span class="av" style="background:#f0668f;">📓</span><span class="lab">ノート</span></button>
    <button class="tab" data-screen="mypage"><span class="av" style="background:#a06fd6;">👑</span><span class="lab">マイページ</span></button>
  </nav>
</div>

<!-- ===== タスク追加モーダル ===== -->
<div class="overlay" id="taskOverlay">
  <div class="sheet">
    <h3>タスクを追加</h3>
    <div class="field"><label>内容</label><input type="text" id="tkText" placeholder="例：単語帳を10ページ進める"></div>
    <div class="field"><label>教科</label><select id="tkSubj"></select></div>
    <div class="field"><label>締切</label><input type="date" id="tkDate"></div>
    <div class="field"><label>優先度</label>
      <div class="pri-pick" id="tkPri">
        <button data-p="高" style="--c:var(--hi)">高</button>
        <button data-p="中" class="on" style="--c:var(--mid)">中</button>
        <button data-p="低" style="--c:var(--low)">低</button>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeTask()">キャンセル</button>
      <button class="btn-ok" onclick="saveTask()">追加する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== データ層 ===================== */
const SUBJECTS = [
  {key:'英語', color:'#f0668f'},
  {key:'数学', color:'#f5a623'},
  {key:'国語', color:'#a06fd6'},
  {key:'理科', color:'#5aa9d6'},
  {key:'その他', color:'#c2bcbc'},
];
const THEMES = ['#f2807a','#f5a623','#f6c445','#f0668f','#a06fd6','#5aa9d6'];
const K = {set:'lm_settings', log:'lm_logs', todo:'lm_todos', streak:'lm_streak', note:'lm_note'};

const load = (k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const save = (k,v)=> localStorage.setItem(k, JSON.stringify(v));

let settings = load(K.set, null);
let logs     = load(K.log, null);
let todos    = load(K.todo, null);
let streak   = load(K.streak, null);
let note     = load(K.note, '');

/* ---- 日付ユーティリティ ---- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => ymd(new Date());
const yesterday = () => { const d=new Date(); d.setDate(d.getDate()-1); return ymd(d); };
const fmtTime = m => pad(Math.floor(m/60))+':'+pad(m%60);

/* ---- 初回サンプルデータ（画像の見た目に合わせる。マイページで消せます） ---- */
function seed(){
  settings = {dailyGoal:300, weeklyGoal:1500, theme:'#f2807a'};
  const t = today(); const d=new Date();
  logs = [
    {id:id(), date:t, subject:'英語', minutes:90},
    {id:id(), date:t, subject:'数学', minutes:60},
    {id:id(), date:t, subject:'国語', minutes:45},
    {id:id(), date:t, subject:'理科', minutes:30},
  ];
  // 過去6日分（今週の学習時間・グラフ用）
  const past=[120,180,150,240,210,255];
  for(let i=1;i<=6;i++){ const p=new Date(); p.setDate(d.getDate()-i);
    logs.push({id:id(), date:ymd(p), subject:'英語', minutes:past[6-i]});
  }
  todos = [
    {id:id(), text:'単語帳を10ページ進める', subject:'英語', deadline:t, done:false, pri:'高'},
    {id:id(), text:'問題集 p.45-60', subject:'数学', deadline:t, done:false, pri:'高'},
    {id:id(), text:'現代文の要点まとめ', subject:'国語', deadline:t, done:false, pri:'中'},
    {id:id(), text:'化学 基礎問題演習', subject:'理科', deadline:t, done:false, pri:'中'},
    {id:id(), text:'リスニングを1セット解く', subject:'英語', deadline:t, done:true, pri:'低'},
  ];
  streak = {last:t, count:12, best:12};
  note = '';
  saveAll();
}
function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function saveAll(){ save(K.set,settings); save(K.log,logs); save(K.todo,todos); save(K.streak,streak); save(K.note,note); }

if(!settings || !logs || !todos || !streak){ seed(); }

/* ===================== 画面切り替え ===================== */
function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id==='screen-'+name));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.screen===name));
  document.querySelector('.screens').scrollTop=0;
  if(name==='home') renderHome();
  if(name==='record') renderRecord();
  if(name==='calendar') renderCal();
  if(name==='mypage') renderMypage();
  if(name==='note') document.getElementById('noteArea').value = note;
}
document.querySelectorAll('.tab').forEach(t=> t.addEventListener('click', ()=>go(t.dataset.screen)));
document.getElementById('burger').addEventListener('click', ()=>go('mypage'));

/* ===================== ヘッダー時計 ===================== */
function tick(){
  const d=new Date();
  const wd=['日','月','火','水','木','金','土'][d.getDay()];
  document.getElementById('hDate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日('+wd+')';
  document.getElementById('hTime').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  const h=d.getHours();
  const gt=document.getElementById('greetText'), gi=document.getElementById('greetIcon');
  if(h<11){ gt.textContent='おはよう！'; gi.textContent='☀️'; }
  else if(h<18){ gt.textContent='こんにちは！'; gi.textContent='🌤️'; }
  else { gt.textContent='こんばんは！'; gi.textContent='🌙'; }
}
tick(); setInterval(tick,10000);

/* ===================== ホーム描画 ===================== */
function todayLogs(){ return logs.filter(l=>l.date===today()); }
function minutesBySubject(list){
  const m={}; SUBJECTS.forEach(s=>m[s.key]=0);
  list.forEach(l=>{ if(m[l.subject]===undefined)m['その他']+=l.minutes; else m[l.subject]+=l.minutes; });
  return m;
}
function renderHome(){
  const tl=todayLogs();
  const total=tl.reduce((a,l)=>a+l.minutes,0);
  document.getElementById('todayTime').textContent=fmtTime(total);
  document.getElementById('todayGoal').textContent='/ '+fmtTime(settings.dailyGoal);
  const pct=Math.min(100, Math.round(total/settings.dailyGoal*100));
  document.getElementById('todayPct').textContent=pct;
  const C=389.6;
  document.getElementById('ringProg').style.strokeDashoffset = C*(1-Math.min(1,total/settings.dailyGoal));

  const bm=minutesBySubject(tl);
  document.getElementById('subjList').innerHTML = SUBJECTS.map(s=>
    `<div class="subj-row"><span class="name"><span class="dot" style="background:${s.color}"></span>${s.key}</span><span class="t">${fmtTime(bm[s.key])}</span></div>`).join('');

  let msg;
  if(pct>=100) msg='🍓 目標達成！本当によくがんばったね！';
  else if(pct>=70) msg='🍓 あと少しで目標達成！この調子でいこう！';
  else if(pct>0) msg='🍓 いいスタート！コツコツ積み上げよう！';
  else msg='🍓 今日の勉強を記録してみよう！';
  document.getElementById('cheer').textContent=msg;

  renderTasks();

  document.getElementById('streakNum').textContent=streak.count;
  // 今週（直近7日）
  let week=0; const days=[];
  for(let i=6;i>=0;i--){ const p=new Date(); p.setDate(p.getDate()-i); const key=ymd(p);
    const m=logs.filter(l=>l.date===key).reduce((a,l)=>a+l.minutes,0); days.push(m); week+=m; }
  document.getElementById('weekTime').innerHTML=fmtTime(week)+' <small>/ '+fmtTime(settings.weeklyGoal)+'</small>';
  drawWeek(days);
}

/* 今週の折れ線グラフ */
function drawWeek(days){
  const w=150,h=52, max=Math.max(60,...days);
  const px=i=> 8 + i*(w-16)/6;
  const py=v=> h-6 - (v/max)*(h-16);
  const pts=days.map((v,i)=>[px(i),py(v)]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area='8,'+(h-6)+' '+line+' '+(w-8)+','+(h-6);
  document.getElementById('weekChart').innerHTML=
    `<polygon points="${area}" fill="var(--accent-soft)"/>`+
    `<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`+
    pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="var(--accent)" stroke-width="2"/>`).join('');
}

/* ===================== タスク ===================== */
let taskFilter='open';
document.querySelectorAll('.filters button').forEach(b=> b.addEventListener('click',()=>{
  taskFilter=b.dataset.f;
  document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));
  renderTasks();
}));
const priColor=p=> p==='高'?'var(--hi)':p==='中'?'var(--mid)':'var(--low)';
const subjColor=k=>{ const s=SUBJECTS.find(x=>x.key===k); return s?s.color:'#c2bcbc'; };
const subjBg=k=>{ const c=subjColor(k); return c+'22'; };

function renderTasks(){
  let list=todos.slice().sort((a,b)=> (a.deadline||'').localeCompare(b.deadline||''));
  if(taskFilter==='open') list=list.filter(t=>!t.done);
  if(taskFilter==='done') list=list.filter(t=>t.done);
  const el=document.getElementById('taskList');
  if(list.length===0){ el.innerHTML='<div class="empty">タスクはありません</div>'; return; }
  const t0=today();
  el.innerHTML=list.map(t=>{
    const overdue = !t.done && t.deadline && t.deadline < t0;
    return `<div class="task ${t.done?'done':''}">
      <div class="check" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</div>
      <span class="tag" style="background:${subjBg(t.subject)};color:${subjColor(t.subject)}">${t.subject}</span>
      <span class="txt">${esc(t.text)}${overdue?' <span style="color:var(--hi);font-size:11px;">⚠️期限切れ</span>':''}</span>
      <span class="pri" style="color:${priColor(t.pri)}">優先度：${t.pri}</span>
      <button class="del" onclick="delTask('${t.id}')">×</button>
    </div>`;
  }).join('');
}
function toggleTask(tid){
  const t=todos.find(x=>x.id===tid); if(!t)return;
  t.done=!t.done; save(K.todo,todos); renderTasks();
  if(t.done) toast('タスク完了！えらい！🎉');
}
function delTask(tid){ todos=todos.filter(x=>x.id!==tid); save(K.todo,todos); renderTasks(); }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* タスク追加モーダル */
let tkPri='中';
function openTask(){
  document.getElementById('tkText').value='';
  document.getElementById('tkDate').value=today();
  const sel=document.getElementById('tkSubj');
  sel.innerHTML=SUBJECTS.map(s=>`<option>${s.key}</option>`).join('');
  document.getElementById('taskOverlay').classList.add('on');
}
function closeTask(){ document.getElementById('taskOverlay').classList.remove('on'); }
document.querySelectorAll('#tkPri button').forEach(b=> b.addEventListener('click',()=>{
  tkPri=b.dataset.p;
  document.querySelectorAll('#tkPri button').forEach(x=>{x.classList.toggle('on',x===b); x.style.background=x===b?priColor(x.dataset.p):'#fff;';});
}));
function saveTask(){
  const text=document.getElementById('tkText').value.trim();
  if(!text){ toast('内容を入力してね'); return; }
  todos.push({id:id(), text, subject:document.getElementById('tkSubj').value, deadline:document.getElementById('tkDate').value, done:false, pri:tkPri});
  save(K.todo,todos); closeTask(); renderTasks(); toast('タスクを追加したよ！');
}
document.getElementById('taskOverlay').addEventListener('click',e=>{ if(e.target.id==='taskOverlay') closeTask(); });

/* ===================== 記録タブ ===================== */
let recSubj='英語';
function renderRecord(){
  document.getElementById('recPicker').innerHTML=SUBJECTS.map(s=>
    `<button class="subj-chip ${s.key===recSubj?'on':''}" style="${s.key===recSubj?`background:${s.color};border-color:${s.color}`:''}" onclick="pickSubj('${s.key}')">${s.key}</button>`).join('');
  const tl=todayLogs();
  const el=document.getElementById('recToday');
  if(tl.length===0){ el.innerHTML='<div class="empty">まだ記録がありません</div>'; return; }
  el.innerHTML=tl.map(l=>
    `<div class="log-item"><span class="dot" style="background:${subjColor(l.subject)}"></span>
     <span style="flex:1;font-weight:700;">${l.subject}</span>
     <span class="t">${fmtTime(l.minutes)}</span>
     <button class="del" onclick="delLog('${l.id}')">×</button></div>`).join('');
}
function pickSubj(k){ recSubj=k; renderRecord(); }
function addMin(n){ const i=document.getElementById('recMin'); i.value=(parseInt(i.value)||0)+n; }
function setMin(n){ document.getElementById('recMin').value=n; }
function saveLog(){
  const m=parseInt(document.getElementById('recMin').value)||0;
  if(m<=0){ toast('勉強した分数を入れてね'); return; }
  logs.push({id:id(), date:today(), subject:recSubj, minutes:m});
  updateStreak();
  saveAll();
  document.getElementById('recMin').value='';
  renderRecord();
  toast(recSubj+' を '+m+'分 記録したよ！📚');
  checkMilestone();
}
function delLog(lid){ logs=logs.filter(x=>x.id!==lid); save(K.log,logs); renderRecord(); }

/* 連続日数 */
function updateStreak(){
  const t=today();
  if(streak.last===t){ /* 今日はもう記録済み：変化なし */ }
  else if(streak.last===yesterday()){ streak.count+=1; }
  else { streak.count=1; }
  streak.last=t;
  if(streak.count>streak.best) streak.best=streak.count;
  save(K.streak,streak);
}

/* 累計時間の区切りメッセージ */
function checkMilestone(){
  const totalMin=logs.reduce((a,l)=>a+l.minutes,0);
  const hours=Math.floor(totalMin/60);
  const marks=[10,50,100,200,500];
  const prev=Math.floor((totalMin-logs[logs.length-1].minutes)/60);
  marks.forEach(mk=>{ if(prev<mk && hours>=mk) setTimeout(()=>toast('🎉 累計'+mk+'時間 達成！すごい！'),700); });
}

/* ===================== カレンダー ===================== */
let calY, calM;
function renderCal(){
  const now=new Date();
  if(calY===undefined){ calY=now.getFullYear(); calM=now.getMonth(); }
  document.getElementById('calTitle').textContent=calY+'年'+(calM+1)+'月';
  const first=new Date(calY,calM,1).getDay();
  const days=new Date(calY,calM+1,0).getDate();
  let html=['日','月','火','水','木','金','土'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<first;i++) html+='<div class="cal-cell empty"></div>';
  const t0=today();
  for(let d=1;d<=days;d++){
    const key=calY+'-'+pad(calM+1)+'-'+pad(d);
    const m=logs.filter(l=>l.date===key).reduce((a,l)=>a+l.minutes,0);
    html+=`<div class="cal-cell ${key===t0?'today':''}" onclick="calDay('${key}')">
      <span>${d}</span>${m>0?`<span class="m">${Math.round(m/60*10)/10}h</span>`:''}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
}
function calMove(n){ calM+=n; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} renderCal(); }
function calDay(key){
  const list=logs.filter(l=>l.date===key);
  const box=document.getElementById('calDetail');
  box.style.display='block';
  document.getElementById('calDetailTitle').textContent=key+' の記録';
  const el=document.getElementById('calDetailList');
  if(list.length===0){ el.innerHTML='<div class="empty">この日は記録がありません</div>'; return; }
  el.innerHTML=list.map(l=>`<div class="log-item"><span class="dot" style="background:${subjColor(l.subject)}"></span><span style="flex:1;font-weight:700;">${l.subject}</span><span class="t">${fmtTime(l.minutes)}</span></div>`).join('')
    +`<div style="text-align:right;font-weight:800;margin-top:8px;">合計 ${fmtTime(list.reduce((a,l)=>a+l.minutes,0))}</div>`;
  box.scrollIntoView({behavior:'smooth'});
}

/* ===================== ノート ===================== */
document.getElementById('noteArea').addEventListener('input',e=>{ note=e.target.value; save(K.note,note); });

/* ===================== マイページ ===================== */
function renderMypage(){
  const total=logs.reduce((a,l)=>a+l.minutes,0);
  document.getElementById('totalTogether').textContent=fmtTime(total);
  document.getElementById('setDaily').value=settings.dailyGoal;
  document.getElementById('setWeekly').value=settings.weeklyGoal;
  document.getElementById('bestStreak').textContent=streak.best+' 日';
  document.getElementById('themeDots').innerHTML=THEMES.map(c=>
    `<button style="background:${c};${c===settings.theme?'box-shadow:0 0 0 3px var(--accent-deep)':''}" onclick="setTheme('${c}')"></button>`).join('');
}
function saveSettings(){
  settings.dailyGoal=Math.max(1,parseInt(document.getElementById('setDaily').value)||300);
  settings.weeklyGoal=Math.max(1,parseInt(document.getElementById('setWeekly').value)||1500);
  save(K.set,settings); toast('目標を保存したよ！');
}
function setTheme(c){
  settings.theme=c; save(K.set,settings); applyTheme(); renderMypage();
}
function applyTheme(){
  const c=settings.theme||'#f2807a';
  const r=document.documentElement.style;
  r.setProperty('--accent',c);
  r.setProperty('--accent-deep', shade(c,-18));
  r.setProperty('--accent-soft', tint(c,.86));
}
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function shade(h,p){ const [r,g,b]=hexToRgb(h); const f=v=>Math.max(0,Math.min(255,Math.round(v*(1+p/100)))); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function tint(h,amt){ const [r,g,b]=hexToRgb(h); const f=v=>Math.round(v+(255-v)*amt); return `rgb(${f(r)},${f(g)},${f(b)})`; }

function resetAll(){
  if(confirm('本当にすべてのデータを消しますか？（記録・タスク・ノート・連続日数）')){
    Object.values(K).forEach(k=>localStorage.removeItem(k));
    location.reload();
  }
}

/* ===================== トースト ===================== */
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),1800);
}

/* ===================== 起動 ===================== */
applyTheme();
renderHome();
</script>
</body>
</html>
